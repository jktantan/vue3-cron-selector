name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  # Allow running the workflow manually from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions required by the official Pages deployment flow.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; queue instead of cancelling so a
# half-finished deployment is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pnpm version from package.json's "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build VitePress site
        run: pnpm docs:build
        env:
          # `base_path` is "/<repo>" for project sites and "" for a custom
          # domain, so appending a slash yields the trailing-slash base that
          # VitePress expects in both cases.
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
